name: Update DSA Progress

on:
  push:
    branches:
      - main

  # Refresh daily so streaks and revision-due dates stay accurate
  # even on days without a push. 22:30 UTC = 04:00 IST, so the rollover
  # happens overnight in India.
  schedule:
    - cron: "30 22 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update README
        # Dates are computed in Asia/Kolkata by the script itself, but keeping
        # the runner on IST too makes any log output easier to read.
        env:
          TZ: Asia/Kolkata
        run: python scripts/update_readme.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md 00-progress/revision-tracker.md 00-progress/revision-state.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update DSA progress [skip ci]"
            git push
          fi
